name: Deploy GitHub Pages

# Upload docs/ as a Pages artifact and deploy via the official Pages actions.
# The annotation layer is injected into the temporary deployment copy only:
# canonical Markdown and committed generated HTML stay unchanged.

on:
  push:
    branches:
      - main
      - agent/add-pages-catalog
    paths:
      - "docs/**"
      - "tools/aris_annotations.js"
      - "tools/inject_annotation_assets.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel in-progress runs on new push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate annotation assets
        run: |
          node --check tools/aris_annotations.js
          python3 -m py_compile tools/inject_annotation_assets.py

      - name: Inject local highlights and notes
        run: python3 tools/inject_annotation_assets.py docs --script tools/aris_annotations.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
